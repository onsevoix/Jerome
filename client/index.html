      <h1>On se voix ? — le podcast de rencontres</h1>
      <p>
        On se voix ? est un podcast de rencontres amoureuses en français, pensé comme une
        alternative aux applications de rencontre. Chaque épisode donne la parole à un⋅e
        célibataire qui se présente avec sa voix : pas de CV amoureux, pas de mise en scène, juste
        des vraies histoires et des vraies voix. Si une voix vous plaît, vous pouvez lui envoyer
        une « décla » (un message) via le site.
      </p>
      <h2>Écouter le podcast gratuitement</h2>
      <ul>

        <li><a href="https://www.deezer.com/fr/show/1000639582">Deezer</a></li>
      </ul>
      <h2>Questions fréquentes</h2>
      <h3>Comment participer à On se voix ? quand on est célibataire ?</h3>
      <p>Il suffit d'envoyer un vocal de présentation via la page Participer. Tous les célibataires peuvent participer, quelle que soit leur ville ou leur orientation. Tous les vocaux ne sont pas diffusés : nous sélectionnons les plus authentiques.</p>
      <h3>Est-ce que c'est payant ?</h3>
      <p>Non, le podcast est gratuit pour les auditeurs comme pour les participants.</p>
      <h3>Comment contacter un⋅e célibataire du podcast ?</h3>
      <p>Via la page « Faire une décla » : choisissez le ou la célibataire dans la liste et écrivez-lui un message.</p>
